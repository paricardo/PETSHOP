<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../static/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../static/css/style.css">
    <title>Registrar Atendimento</title>
</head>

<body data-bs-theme="dark">

    <header class="container-fluid bg-primary d-flex justify-content-between p-2 pt-3">
        <div class="mt-1">
            <a onclick="window.history.back()" href="#">
                <img src="../../static/icons/retorno.svg" alt="Retornar">
            </a>
        </div>

        <div>
            <h1 class="text-white">Novo Atendimento</h1>
        </div>

        <div class="mx-2"></div>
    </header>

    <form class="container border p-3 mt-3 rounded"
          action="{{ url_for('appointment.create') }}"
          method="post">

        <h4 class="my-3">{{ customer.name }}</h4>

        <input
            type="hidden"
            name="customer_id"
            value="{{ customer.id }}"
        >

        <!-- Pet -->
        <div class="mb-3">
            <label class="form-label">Pet</label>

            <select class="form-select" name="pet_id" required>
                <option value="" selected disabled>
                    Selecione um pet
                </option>

                {% for pet in customer.pets %}
                    <option value="{{ pet.id }}">
                        {{ pet.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- Funcionário -->
        <div class="mb-3">
            <label class="form-label">Funcionário</label>

            <select class="form-select" name="user_id" required>
                <option value="" selected disabled>
                    Selecione um usuário
                </option>

                {% for user in users %}
                    <option value="{{ user.id }}">
                        {{ user.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- Serviço -->
        <div class="mb-3">
            <label class="form-label">Serviço</label>

            <select class="form-select" name="package_id" required>
                <option value="" selected disabled>
                    Selecione um serviço
                </option>

                {% for package in packages %}
                    <option value="{{ package.id }}">
                        {{ package.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- Status -->
        <div class="form-check my-3">
            <input
                class="form-check-input"
                type="checkbox"
                id="status"
                name="status"
                Value="in_progress"
            >

            <label class="form-check-label" for="status">
                Em andamento
            </label>
        </div>

        <!-- Data -->
        <div class="mb-3">
            <label for="date" class="form-label">
                Data do Agendamento
            </label>

            <input
                type="date"
                class="form-control"
                id="date"
                name="scheduled_at"
                required
            >
        </div>

        <!-- Observações -->
        <div class="form-floating my-3">
            <textarea
                class="form-control"
                name="notes"
                id="floatingTextarea2"
                placeholder="Observações"
                style="height: 100px"
            ></textarea>

            <label for="floatingTextarea2">
                Observações
            </label>
        </div>

        <button class="btn btn-primary w-100" type="submit">
            Cadastrar
        </button>

    </form>

    <script src="../../static/js/bootstrap.bundle.min.js"></script>

</body>
</html>
