<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../static/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../static/css/style.css">
    <title>Registrar Atendimento</title>
</head>
<body data-bs-theme="dark">
    <header class="container-fluid bg-primary d-flex justify-content-between p-2 pt-3">
        <div class="mt-1">
            <a onclick="window.history.back()" href="#">
                <img src="../../static/icons/retorno.svg" alt="retornar">
            </a>
        </div>
        <div>
            <h1 class="text-white">Registrar Atendimento</h1>
        </div>

        <div class="mx-2"></div>
    </header>

    <form class="container border p-3 mt-3 rounded" action="{{ url_for('appointment.create')}}" method="post">


        <!-- Nome -->
        <div class="mb-3">

            <label class="form-label">
                Nome
            </label>

            <input 
                type="text"
                class="form-control"
                name="name"
                placeholder="Digite o nome">

        </div>



        <!-- Telefone -->
        <div class="mb-3">

            <label class="form-label">
                Telefone
            </label>

            <input 
                type="tel"
                class="form-control"
                name="phone"
                placeholder="(00) 00000-0000">

        </div>



        <!-- Email -->
        <div class="mb-3">

            <label class="form-label">
                Email
            </label>

            <input 
                type="email"
                class="form-control"
                name="email"
                placeholder="email@email.com">

        </div>



        <!-- Endereço -->
        <div class="mb-3">

            <label class="form-label" for="address">
                Endereço
            </label>

            <textarea
                class="form-control"
                id="address"
                name="address"
                rows="3"
                placeholder="Rua, número, bairro"></textarea>

        </div>



        <!-- Notas -->
        <div class="mb-3">

            <label class="form-label">
                Notas
            </label>

            <textarea
                class="form-control"
                name="notes"
                rows="4"
                placeholder="Observações sobre o cliente">
            </textarea>

        </div>



        <!-- Status -->
        <div class="mb-3">

            <label class="form-label d-block">
                Status
            </label>


            <div class="form-check form-check-inline">

                <input
                    class="form-check-input"
                    type="radio"
                    name="is_active"
                    id="active"
                    value="active"
                    checked>

                <label 
                    class="form-check-label"
                    for="active">

                    Ativo

                </label>

            </div>



            <div class="form-check form-check-inline">

                <input
                    class="form-check-input"
                    type="radio"
                    name="is_active"
                    id="inactive"
                    value="inactive">

                <label 
                    class="form-check-label"
                    for="inactive">

                    Inativo

                </label>

            </div>


        </div>

        <input class="btn btn-primary w-100" type="submit" value="Cadastrar">

    </form>

    <script src="../../static/js/bootstrap.bundle.min.js"></script>

</body>
</html>
