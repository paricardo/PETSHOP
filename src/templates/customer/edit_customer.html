    <!-- Modal Cliente -->
    <div class="modal fade" id="editCustomer" tabindex="-1" aria-hidden="true">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <!-- Cabeçalho -->
                <div class="modal-header">

                    <h5 class="modal-title">
                        Editar Cliente
                    </h5>

                    <button 
                        type="button" 
                        class="btn-close" 
                        data-bs-dismiss="modal"
                        aria-label="Fechar">
                    </button>

                </div>


                <!-- Corpo -->
                <div class="modal-body">

                    <form>


                        <!-- Nome -->
                        <div class="mb-3">

                            <label class="form-label">
                                Nome
                            </label>

                            <input 
                                type="text"
                                class="form-control"
                                name="name"
                                placeholder="Digite o nome">

                        </div>



                        <!-- Telefone -->
                        <div class="mb-3">

                            <label class="form-label">
                                Telefone
                            </label>

                            <input 
                                type="tel"
                                class="form-control"
                                name="phone"
                                placeholder="(00) 00000-0000">

                        </div>



                        <!-- Email -->
                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input 
                                type="email"
                                class="form-control"
                                name="email"
                                placeholder="email@email.com">

                        </div>



                        <!-- Endereço -->
                        <div class="mb-3">

                            <label class="form-label">
                                Endereço
                            </label>

                            <input 
                                type="text"
                                class="form-control"
                                name="address"
                                placeholder="Rua, número, bairro">

                        </div>



                        <!-- Notas -->
                        <div class="mb-3">

                            <label class="form-label">
                                Notas
                            </label>

                            <textarea
                                class="form-control"
                                name="notes"
                                rows="4"
                                placeholder="Observações sobre o cliente">
                            </textarea>

                        </div>



                        <!-- Status -->
                        <div class="mb-3">

                            <label class="form-label d-block">
                                Status
                            </label>


                            <div class="form-check form-check-inline">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="status"
                                    id="active"
                                    value="active"
                                    checked>

                                <label 
                                    class="form-check-label"
                                    for="active">

                                    Ativo

                                </label>

                            </div>



                            <div class="form-check form-check-inline">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="status"
                                    id="inactive"
                                    value="inactive">

                                <label 
                                    class="form-check-label"
                                    for="inactive">

                                    Inativo

                                </label>

                            </div>


                        </div>


                    </form>


                </div>


                <!-- Rodapé -->
                <div class="modal-footer">

                    <button 
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Cancelar

                    </button>


                    <button 
                        type="submit"
                        class="btn btn-primary">

                        Salvar Cliente

                    </button>

                </div>


            </div>

        </div>

    </div>
