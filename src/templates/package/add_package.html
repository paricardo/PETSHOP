<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../static/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../static/css/style.css">
    <title>Cadastrar Pacote</title>
</head>
<body data-bs-theme="dark">
    <header class="container-fluid bg-primary d-flex justify-content-between p-2 pt-3">
        <div class="mt-1">
            <a onclick="window.history.back()" href="#">
                <img src="../../static/icons/retorno.svg" alt="retornar">
            </a>
        </div>
        <div>
            <h1 class="text-white">Cadastro de Pacote</h1>
        </div>

        <div class="mx-2"></div>
    </header>

    <form class="container border p-3 mt-3 rounded" action="{{ url_for('package.create')}}" method="post">


        <!-- Nome -->
        <div class="mb-3">

            <label class="form-label">
                Nome
            </label>

            <input 
                type="text"
                class="form-control"
                name="name"
                placeholder="Digite o nome">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Preço P/Pequeno
            </label>

            <input 
                type="number"
                class="form-control"
                name="price_small"
                step="0.01"
                placeholder="Digite o preço do pacote">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Preço P/Médio
            </label>

            <input 
                type="number"
                class="form-control"
                name="price_medium"
                step="0.01"
                placeholder="Digite o preço do pacote">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Preço P/Grande
            </label>

            <input 
                type="number"
                class="form-control"
                name="price_large"
                step="0.01"
                placeholder="Digite o preço do pacote">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Quantidade de atendimentos
            </label>

            <input 
                type="number"
                class="form-control"
                name="quantity"
                step="0.01"
                placeholder="Digite a quantidade de atendimentos">

        </div>


        <!-- Serviços -->
        <div class="mb-3">

            <label class="form-label" for="services">
                Serviços
            </label>

            <textarea
                class="form-control"
                id="address"
                name="services"
                rows="3"
                placeholder="Banho e Tosa"></textarea>

        </div>


        <input class="btn btn-primary w-100" type="submit" value="Cadastrar">

    </form>

    <script src="../../static/js/bootstrap.bundle.min.js"></script>

</body>
</html>
