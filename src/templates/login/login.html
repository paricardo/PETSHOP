<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../static/css/style.css">
    <link rel="stylesheet" href="../../static/css/bootstrap.min.css">
    <title>Login</title>
    <style>
        @media (max-width: 767px) {
           .form-mobile {
                border: none !important;
                box-shadow: none !important;
                display: flex;
                flex-direction: column;
                align-items: center !important;
                justify-content: center !important;
            }

            .label-mobile {
                margin-left: -290px !important;
            }

            .input-mobile {
                width: 350px !important;
            }
        }
    </style>
</head>
<body data-bs-theme="dark">

    
    <main class="container-fluid d-flex flex-column align-items-center">
        <img style="width: 300px; height: auto; margin-right: 50px;" src="../../static/images/logo_azul.png" alt="Logo">
            
        <form action="{{ url_for('auth.auth') }}" method="post" style="max-width: 550px;" class="form-mobile w-100 border shadow rounded p-5">
            <div class="label-mobile" style="margin-left: 10px;">
                <label for="email" class="form-label">E-mail:</label>
            </div>
            <input type="email" id="email" name="email" class="input-mobile form-control mt-0 m-2 w-100" required>

            <div class="label-mobile" style="margin-left: 10px;">
                <label for="email" class="form-label">Senha:</label>
            </div>
            <input type="password" id="password" name="password" class="input-mobile form-control mt-0 m-2 w-100" required>

            <input type="submit" value="Entrar" class="input-mobile btn btn-primary mt-3 m-2 w-100">
        </form>

        <div class="mt-2 mb-5">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="alert">
                            </button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>

        <footer class="text-center">
            <a href="https://wa.me/5562991693359?text=Ol%C3%A1%2C%20preciso%20de%20ajuda%20com%20o%20sistema%20do%20meu%20pet!!!"> Suporte </a>
        </footer>
    </main>

    <script src="../../static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
