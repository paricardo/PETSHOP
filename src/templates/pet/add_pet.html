<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../static/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../static/css/style.css">
    <title>Cadastrar Cliente</title>
</head>
<body data-bs-theme="dark">
    <header class="container-fluid bg-primary d-flex justify-content-between p-2 pt-3">
        <div class="mt-1">
            <a onclick="window.history.back()" href="#">
                <img src="../../static/icons/retorno.svg" alt="retornar">
            </a>
        </div>
        <div>
            <h1 class="text-white">Cadastro de Cliente</h1>
        </div>

        <div class="mx-2"></div>
    </header>

    <form class="container border p-3 mt-3 rounded" action="{{ url_for('pet.create')}}" method="post" enctype="multipart/form-data">

        <h4>{{ customer.name }}</h4>
        <input type="text" name="customer_id" value="{{ customer.id }}" hidden>

        <input
            type="file"
            name="photo"
            accept="image/*">

        <!-- Nome -->
        <div class="mb-3">

            <label class="form-label">
                Nome
            </label>

            <input 
                type="text"
                class="form-control"
                name="name"
                placeholder="Digite o nome do pet">

        </div>



        <!-- Raça -->
        <div class="mb-3">

            <label class="form-label">
                Raça
            </label>

            <input 
                type="text"
                class="form-control"
                name="breed"
                placeholder="Pitbull">

        </div>



        <!-- Notas -->
        <div class="mb-3">

            <label class="form-label">
                Observações
            </label>

            <textarea
                class="form-control"
                name="notes"
                rows="4">
            </textarea>

        </div>


        <input class="btn btn-primary w-100" type="submit" value="Cadastrar">

    </form>

    <script src="../../static/js/bootstrap.bundle.min.js"></script>

</body>
</html>
